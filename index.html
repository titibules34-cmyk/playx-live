<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayX Live – Demo Sportsbook</title>
<style>
:root{--bg:#474747;--panel:#e5e5e5;--red:#6b0000;--side:#3a3a3a;--card:#555;--txt:#f2f2f2;--yel:#ffe000;--grn:#2ecc71;--ink:#111}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;cursor:pointer}
#login{display:flex;justify-content:center;padding-top:60px}
.box{background:var(--panel);width:360px;max-width:92vw;padding:24px;color:var(--ink)}
.box input{width:100%;padding:16px 12px;margin-bottom:14px;border:1px solid #ccc;background:#e5e5e5;font-size:16px}
.btn{background:var(--red);color:#fff;border:0;padding:16px;width:100%}
.demo{font-size:12px;color:#666;margin-top:10px;text-align:center}
header{background:var(--red);display:flex;align-items:center;gap:20px;padding:14px 18px;flex-wrap:wrap}
.logo{font-weight:700;font-size:22px}.logo b{color:var(--yel)}
nav{display:flex;gap:22px;margin:0 auto}nav button{background:none;border:0;color:#fff;padding:6px 0;border-bottom:3px solid transparent}
nav button.on{border-color:var(--yel)}.bal{color:var(--grn);font-weight:700}
#wrap{display:grid;grid-template-columns:210px 1fr 300px;min-height:calc(100vh - 56px)}
aside{background:var(--side)}aside button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #444;color:#ccc;padding:12px 16px}
aside button.on{background:#222;color:#fff}
main{padding:10px;overflow:hidden}.sec{background:var(--red);padding:12px;font-weight:700;margin-top:10px}
.item{background:var(--card);margin-top:2px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.item .tm{font-size:12px;color:#ccc}.o{display:flex;gap:2px;min-width:240px}
.o button{flex:1;background:#4a4a4a;border:0;color:var(--txt);padding:12px 4px}.o button b{color:var(--yel);margin-left:4px}
.o button.sel{background:var(--yel);color:#000}.o button.sel b{color:#000}
.s{color:var(--yel);font-weight:700}
#slip{background:var(--panel);color:var(--ink);padding:12px}#slip h3{margin:0 0 8px}
.sl{background:#fff;padding:8px;margin-bottom:6px;font-size:13px;position:relative}.sl .x{position:absolute;right:6px;top:4px;border:0;background:none}
#slip input{width:100%;padding:10px;font-size:16px;margin:6px 0}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:6px;border:1px solid #aaa;background:#fff}.tabs .on{background:var(--red);color:#fff}
.bet{background:#555;padding:12px;margin:8px 0}.won{border-left:5px solid var(--grn)}.lost{border-left:5px solid #e74c3c}.small{font-size:13px;color:#ddd}
.err{background:#8a2a2a;padding:10px;margin-top:8px}
@media(max-width:860px){#wrap{grid-template-columns:1fr}aside{display:flex;overflow-x:auto}aside button{white-space:nowrap;border:0}}
</style></head><body>
<div id="login"><div class="box">
<input id="u" placeholder="Username" autocomplete="off"><input id="p" type="password" placeholder="Password">
<button class="btn" onclick="auth('login')">Log in</button>
<button class="btn" style="background:#444;margin-top:8px" onclick="auth('signup')">Create account (1,000 credits)</button>
<div id="lerr" class="demo" style="color:#b00"></div>
<div class="demo">DEMO · play credits only · no real money, no deposits, no payouts</div></div></div>
<div id="app" hidden>
<header><div class="logo">PLAY<b>X</b></div>
<nav><button class="on" id="n0" onclick="tab(0)">Sport</button><button id="n1" onclick="tab(1)">Live</button><button id="n2" onclick="tab(2)">My Bets</button><button id="n3" onclick="tab(3)">Leaderboard</button></nav>
<div><span id="who"></span> · Credits: <span class="bal" id="bal"></span> <button onclick="logout()" style="margin-left:8px">Log out</button></div></header>
<div id="wrap"><aside id="side"></aside><main id="main"></main><div id="slip"></div></div></div>
<script>
const SP=[["soccer_epl","Premier League"],["soccer_uefa_champs_league","Champions League"],["soccer_spain_la_liga","La Liga"],["soccer_italy_serie_a","Serie A"],["soccer_germany_bundesliga","Bundesliga"],["basketball_nba","NBA"],["icehockey_nhl","NHL"],["americanfootball_nfl","NFL"]];
const $=id=>document.getElementById(id),LB=["1","X","2"];
let TK="",S={name:"",bal:0,bets:[],admin:false},slip=[],mode="single",sport=SP[0][0],view=0,odds={},scores={},err="",board=[],msg="";
async function api(a,d){const r=await fetch("/api/app",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({a,t:TK,...d})});const j=await r.json();if(!r.ok){if(r.status==401&&TK)logout();throw new Error(j.error||r.status)}return j}
function enter(j){TK=j.token||TK;try{localStorage.setItem("pxt",TK)}catch(e){}S=j;$("login").hidden=true;$("app").hidden=false;load();if(!window.tm)window.tm=setInterval(load,60000)}
async function auth(a){try{enter(await api(a,{u:$("u").value,p:$("p").value}))}catch(e){$("lerr").textContent=e.message}}
function logout(){TK="";try{localStorage.removeItem("pxt")}catch(e){}location.reload()}
try{const t=localStorage.getItem("pxt");if(t){TK=t;api("state",{}).then(enter).catch(()=>{})}}catch(e){}
function tab(i){view=i;[0,1,2,3].forEach(k=>$("n"+k).className=k==i?"on":"");load();draw()}
async function get(type,sp){try{const r=await fetch(`/api/data?type=${type}&sport=${sp}`),j=await r.json();if(!r.ok)throw new Error(j.error||r.status);err="";return j}catch(e){err="Could not load data: "+e.message;return null}}
async function load(){
 const o=await get("odds",sport);if(o)odds[sport]=o;
 if(view==1){const sc=await get("scores",sport);if(sc)scores[sport]=sc}
 try{const st=await api("state",{});S=st}catch(e){}
 if(view==3){try{board=(await api("board",{})).rows}catch(e){}}
 draw()}
function pick(id,k,o,name){const i=slip.findIndex(s=>s.id==id);
 if(i>=0){const same=slip[i].k==k;slip.splice(i,1);if(same){draw();return}}
 slip.push({id,sport,k,odds:o,name});draw()}
function rm(i){slip.splice(i,1);draw()}
function btns(e){return `<div class="o">${e.odds.map((o,k)=>o?`<button class="${slip.some(s=>s.id==e.id&&s.k==k)?"sel":""}" onclick='pick("${e.id}",${k},${o},${JSON.stringify(e.home+" – "+e.away)})'>${LB[k]}<b>${o.toFixed(2)}</b></button>`:"").join("")}</div>`}
function stake(){return parseFloat($("st")?.value)||0}
function calc(){const t=$("tot");if(!t)return;const s=stake();
 t.textContent=(mode=="single"?s*slip.reduce((a,b)=>a+b.odds,0):s*slip.reduce((a,b)=>a*b.odds,1)).toFixed(2)}
async function place(){if(!slip.length)return;
 try{S=await api("bet",{mode,stake:stake(),sel:slip.map(s=>({id:s.id,sport:s.sport,k:s.k}))});slip=[];msg="";load()}catch(e){alert(e.message)}}
async function give(){try{const j=await api("give",{to:$("gt").value,amt:$("ga").value});msg="Done. New balance: "+j.bal;load()}catch(e){msg=e.message;draw()}}
const fmt=t=>new Date(t).toLocaleString([],{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function draw(){$("bal").textContent=(S.bal||0).toFixed(2);$("who").textContent=S.name;
 $("side").innerHTML=SP.map(([k,n])=>`<button class="${k==sport?"on":""}" onclick="sport='${k}';load();draw()">${n}</button>`).join("");
 let h=err?`<div class="err">${err}</div>`:"";const now=Date.now();
 if(view==0){const ev=(odds[sport]||[]).filter(e=>new Date(e.time)>now).sort((a,b)=>a.time<b.time?-1:1);
  h+=`<div class="sec">${SP.find(s=>s[0]==sport)[1]} – upcoming</div>`+(ev.map(e=>`<div class="item"><div><div class="tm">${fmt(e.time)}</div>${e.home} – ${e.away}</div>${btns(e)}</div>`).join("")||"<p>No upcoming matches loaded.</p>")}
 if(view==1){const lv=(scores[sport]||[]).filter(e=>!e.completed&&e.scores);
  h+=`<div class="sec">LIVE NOW</div>`+(lv.map(e=>`<div class="item"><div>${e.home} – ${e.away} <span class="s">${e.scores.map(s=>s.score).join(" - ")}</span></div></div>`).join("")||"<p>No live matches right now in this league.</p>")}
 if(view==2){h+=`<div class="sec">MY BETS</div><p class="small">Odds are locked when you place a bet. Bets settle automatically when the real match ends.</p>`+(S.bets.map(b=>`<div class="bet ${b.st}"><b>${b.type}</b> · stake ${b.stake.toFixed(2)} · <b>${b.st.toUpperCase()}</b>${b.sel.map(x=>`<div class="small">${x.name}: ${LB[x.k]} @ ${x.odds.toFixed(2)}</div>`).join("")}</div>`).join("")||"<p>No bets yet.</p>")}
 if(view==3){h+=`<div class="sec">LEADERBOARD</div>`+board.map((r,i)=>`<div class="item"><div>${i+1}. ${r.name}</div><b class="s">${r.bal.toFixed(2)}</b></div>`).join("");
  if(S.admin)h+=`<div class="sec">ADMIN – give or take credits</div><div class="item"><input id="gt" placeholder="username"><input id="ga" type="number" placeholder="amount (negative to remove)"><button onclick="give()">Apply</button><span class="small">${msg}</span></div>`}
 $("main").innerHTML=h;const keep=$("st")?.value||"10";
 $("slip").innerHTML=`<h3>Bet slip (${slip.length})</h3><div class="tabs"><button class="${mode=="single"?"on":""}" onclick="mode='single';draw()">Single</button><button class="${mode!="single"?"on":""}" onclick="mode='multi';draw()">Multiple</button></div>`+
 (slip.map((s,i)=>`<div class="sl"><button class="x" onclick="rm(${i})">✕</button><b>${s.name}</b><br>Pick ${LB[s.k]} @ ${s.odds.toFixed(2)}</div>`).join("")||"<p>Tap odds to add selections.</p>")+
 `<input id="st" type="number" min="1" value="${keep}" oninput="calc()">Potential win: <b id="tot">0.00</b><br><button class="btn" style="margin-top:10px" onclick="place()">Place bet</button><div class="demo">Play credits only</div>`;calc()}
</script></body></html>
